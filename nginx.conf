server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Performance & Security
    etag on;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_static on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_types 
        text/plain 
        text/css 
        application/json 
        application/javascript 
        text/javascript 
        text/xml 
        application/xml 
        application/xml+rss 
        image/svg+xml 
        application/vnd.ms-fontobject 
        font/truetype 
        font/opentype 
        application/x-font-ttf
        image/webp;

    # Hashed assets (JS, CSS) — immutable, cache for 1 year
    # These filenames contain content hashes so they're safe to cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Static images and fonts — cache for 30 days
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Security headers on all responses
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # SPA Routing - For any other request, return index.html
    location / {
        try_files $uri $uri/ /index.html;
        # HTML pages: never cache — users always get fresh content
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Explicitly handle index.html — never cache
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
